		}

		VARIANT
		{
			name = s3FloatingRing
			displayName = Floating Ring
			primaryColor = #3a562a
			secondaryColor = #9e7100
			sizeGroup = GroupA
			GAMEOBJECTS
			{
				S3Pylon1 = false
				S3Pylon2 = false
				S3Pylon3 = false
				Mk3Pylon1 = false
				Mk3Pylon2 = false
			}
		}

	}
	
		MODULE
    {
        name = ModuleCargoPart
        packedVolume = 129514
	}

	RESOURCE
	{
		name = StaticCharge
		amount = 0
		maxAmount = 300
	}
}