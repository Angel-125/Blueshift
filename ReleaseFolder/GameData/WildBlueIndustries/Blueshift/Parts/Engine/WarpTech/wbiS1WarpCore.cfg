		}
		INPUT_RESOURCE
		{
			ResourceName = FusionPellets
			Ratio = 0.00005
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = GravityWaves
			Ratio = 50
