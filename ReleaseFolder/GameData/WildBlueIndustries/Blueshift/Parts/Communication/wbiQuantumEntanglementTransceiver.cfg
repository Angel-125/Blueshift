// Global blacklist
// Quantum Entangled Transceivers require Entangled Graviolium, which can only be produced on Kerbin.
// There is an unfinished and experimental process for allowing users to build QETs out in the field.
// Check out SandcastleQuantumTransceiver.txt.
PARTS_BLACKLIST:NEEDS[!SandcastleFieldQET]
{
	blacklistedPart = wbiQuantumEntanglementTransceiver
}

PART
{
	name = wbiQuantumEntanglementTransceiver
	module = Part
	author = mgb125
	
	MODEL
	{
		model = WildBlueIndustries/Blueshift/Parts/Engine/WarpTech/quantumTransceiver
	}
	rescaleFactor = 1.0
	
	// Attachment rules: allows surface mounting anywhere
	node_attach = 0, 0, 0.156, 0, 0, -1, 1
	attachRules = 0,1,0,0,1
	
	// Progression and Cost
	TechRequired = experimentalScience
	entryCost = 150000
	cost = 150000
	category = Communication
	subcategory = 0
	
	// Editor Details
	title = #LOC_BLUESHIFT_wbiQuantumEntanglementTransceiverTitle // QE-1 Quantum Entanglement Transceiver
	manufacturer = #autoLOC_501635 //#autoLOC_501635 = Ionic Symphonic Protonic Electronics
	description = #LOC_BLUESHIFT_wbiQuantumEntanglementTransceiverDesc // Utilizing tightly bound pairs of entangled subatomic particles, the QE-1 delivers instantaneous, zero-latency telemetry data across infinite distances. Because it operates via quantum non-locality, it completely bypasses standard signal blockage and range limitations- so long as there is another QET on the other end.
	
	// Physical Attributes
	mass = 0.25
	dragModelType = default
	maximum_drag = 0.1
	minimum_drag = 0.1
	angularDrag = 1
	crashTolerance = 10
	maxTemp = 2000
	tags = cck-Blueshift
	
	// Telemetry Profile
	MODULE
	{
		name = ModuleDataTransmitter
		antennaType = RELAY
		packetInterval = 0.35
		packetSize = 1
		packetResourceCost = 20
		requiredResource = ElectricCharge
		antennaPower = 2000000000
		antennaCombinable = True

//		INPUT_RESOURCE:NEEDS[WildBlueIndustries/Sandcastle,WildBlueIndustries/WBIResources|WildBlueIndustries/WBIOmniResources]
//		{
//			name = wbiEntangledGraviolium
//			rate = 0.01
//		}
	}

	MODULE
	{
		name = WBICommNetLinkOptions
		bypassRange = true
		bypassOcclusion = true
		requireMatchingPeer = true
		useJumpGateNetwork = false
		linkID = quantumRelay
	}

	MODULE
	{
		name = ModuleCargoPart
		packedVolume = 402
	}
}
