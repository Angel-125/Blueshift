PART
{
	name = wbiLowGravCompensator
	module = Part
	author = Angel-125
	MODEL
	{
		model = WildBlueIndustries/Blueshift/Parts/Engine/WarpTech/lowGravCompensator
	}
	rescaleFactor = 1
	
	node_attach = 0, 0, 0.156, 0, 0, -1, 0
	
	TechRequired = wbiGravityWaveApplications
	category = Utility
	entryCost = 32000
	cost = 27000
	subcategory = 0
	title = Low-Grav Compensator
	manufacturer = <CLASSIFIED>
	description = The Low-Grav Compensator is the result of a contragravity generator experiment that was considered to be a failure until scientists realized that they just needed to reverse the polarity. But the failure gave them an idea: give rovers a downward push on low-g worlds to simulate driving in a 1-g environment.
	attachRules = 0,1,0,0,0
	
	// --- standard part parameters ---
	mass = 0.25
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 1
	crashTolerance = 8
	maxTemp = 1200 // = 3200
	PhysicsSignificance = 1
	bulkheadProfiles = srf
	tags = cck-Blueshift

	MODULE
	{
		name = WBIModuleGeneratorFX
//		debugMode = true

		groupName = #LOC_BLUESHIFT_gravityGroup

		// Setting this to the same value as WBIWarpEngine's warpPowerGeneratorID field lets the warp engine control the generator.
		// If the generator controls effects and/or animated textures, then they'll be affected by the throttle updates.
		moduleID = gwGenerator

		// This also replaces the name shown in the editor.
		ConverterName = Auxilary Power

		// Short description of the module as displayed in the editor.
		moduleDescription = Provides auxilary gravitic power.

		StartActionName = G-Wave Generator: On
		StopActionName = G-Wave Generator: Off
		ToggleActionName = Toggle GW Generator

		// Generators can control effects too
//		startEffect = effectStart
//		stopEffect = effectStop
		runningEffect = running

		INPUT_RESOURCE
		{
			ResourceName = Graviolium
			Ratio = 0.001
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 20
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = GravityWaves
			Ratio = 25
			DumpExcess = true
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = StaticCharge
			Ratio = 0.001
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}
		DRAINED_RESOURCE
		{
			ResourceName = GravityWaves
			Ratio = 5
			FlowMode = NO_FLOW
		}
	}

	MODULE
	{
		name = WBIGravityGenerator

		groupName = #LOC_BLUESHIFT_gravityGroup
		ConverterName = Gravity Generator
		moduleDescription = Generates gravity to simulate a 1g environment.

		StartActionName = Gravity Generator: On
		StopActionName = Gravity Generator: Off
		ToggleActionName = Toggle Grav Gen

		// Max amount of mass that the generator can support before experiencing reductions in gravitic acceleration.
		maxTonnage = 20

		INPUT_RESOURCE
		{
			ResourceName = GravityWaves
			Ratio = 20
			DumpExcess = true
			FlowMode = ALL_VESSEL
		}
	}

	MODULE
	{
		name = ModuleCargoPart
		packedVolume = 365
	}

	RESOURCE
	{
		name = Graviolium
		amount = 0
		maxAmount = 30
	}

	RESOURCE
	{
		name = GravityWaves
		amount = 0
		maxAmount = 25
	}

	RESOURCE
	{
		name = ElectricCharge
		amount = 0
		maxAmount = 100
	}

	RESOURCE
	{
		name = StaticCharge
		amount = 0
		maxAmount = 50
	}
}
