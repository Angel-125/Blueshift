		#LOC_BLUESHIFT_wbiMk2GraviticGeneratorTitle = Mk2 Gravimetric Displacement Generator
		#LOC_BLUESHIFT_wbiMk2GraviticGeneratorDesc = Using a cyclotron instead of a particle accelerator ring gives the gravitic displacement generator a much more compact form than the S-3 Warp Engine's generator, but it comes at the expense of reduced gravity wave output. Instead of relying on parts salvaged from [REDACTED], it uses kerbal-tech to achieve its capabilities.
		#LOC_BLUESHIFT_wbiMk2MultiCoilTitle = Mk2 Warp Coil (Multi)
		#LOC_BLUESHIFT_wbiMk2MultiCoilDesc = This multi-segmented warp coil uses a series of smaller rings to generate the warp capacity needed for faster than light travel.
		#LOC_BLUESHIFT_wbiMk2WarpCoilTitle = Mk2 Warp Coil
		#LOC_BLUESHIFT_wbiMk2WarpCoilDesc = Instead of one large ring shape, this warp coil uses a series of smaller rings to generate the warp capacity needed for faster than light travel. Its output is considerably less than the Mk2 Warp Coil, however.
		#LOC_BLUESHIFT_wbiMk2WarpCoreTitle = Mk2 "Starflight" Warp Core
		#LOC_BLUESHIFT_wbiMk2WarpCoreDesc = The Mk2 "Starflight" Warp Core is specially designed for space planes. it can dock with the Mk2 Warp Ring or make use of other types of warp coils. Some components were [REDACTED] from [REDACTED] and aren’t well understood, but they should work [REDACTED] to propel a vessel faster than light.
		#LOC_BLUESHIFT_wbiMk2WarpRingTitle = Mk2 Warp Ring
		#LOC_BLUESHIFT_wbiMk2WarpRingDesc = Designed to be launched separately and left in orbit, this warp ring has a docking port that is compatible with the Mk2 Warp Core and Mk2 Gravimetric Dispacement Generator.
