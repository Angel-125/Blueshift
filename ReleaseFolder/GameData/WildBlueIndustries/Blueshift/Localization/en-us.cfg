		#LOC_BLUESHIFT_inertialDampenerDesc = Powered by Graviolium, this device disturbs the quantum vacuum around your ship and its exhaust stream, reducing inertial resistance during engine burns. The result? More thrust, better ISP, and longer burns- all without changing your mass on paper. Where does the inertia go? Don't ask.
		#LOC_BLUESHIFT_dampenerGroup = Inertial Dampener
		#LOC_BLUESHIFT_dampenerConverterTitle = Zero-Point Inertial Dampener
		#LOC_BLUESHIFT_dampenerConverterDesc = Reduces inertial mass, effectively improving engine thrust and ISP.
		#LOC_BLUESHIFT_dampenerStartName = Activate Inertial Dampener
		#LOC_BLUESHIFT_dampenerStopName = Deactivate Inertial Dampener
