		#LOC_BLUESHIFT_wbiStardustTitle = Stardust Graviolium Collector
		#LOC_BLUESHIFT_wbiStardustDesc = While mining asteroids and prospecting yield the best veins of Graviolium, dust-form Graviolium does exist in the magnetospheres of certain worlds. The Stardust Graviolium Collector can slowly accumulate Graviolium over time given sufficient orbital altitude and ElectricCharge.
		#LOC_BLUESHIFT_wbiTetTitle = Space Tetrahedron
		#LOC_BLUESHIFT_wbiTetDesc = A large and intimidating stone tetrahedron that might confer great knowlege... or obliterate the surface of your planet.
		#LOC_BLUESHIFT_wbiWormholeTitle = Wormhole
		#LOC_BLUESHIFT_wbiWormholeDesc = A very large, spherical hole in space.
		#LOC_BLUESHIFT_wbiAstriaPortaTitle = Astria Porta
		#LOC_BLUESHIFT_wbiAstriaPortaDesc = After studying the [REDACTED] that we [REDACTED], we [REDACTED] the [REDACTED] and then [REDACTED] the [REDACTED] in order to create the Astria Porta. Combined with nine Astria Porta Auxilium segments, the Astria Porta forms a jumpgate that enables users to instantly traverse vast distances to a desired destination gate.
		#LOC_BLUESHIFT_wbiAstriaPortaAccommodareTitle = Astria Porta Accommodare
		#LOC_BLUESHIFT_wbiAstriaPortaAccommodareDesc = This simple but handy adapter helps spacecraft launch Astria Porta segments into orbit.
		#LOC_BLUESHIFT_wbiAstriaPortaSupportTitle = Astria Porta Auxilium
		#LOC_BLUESHIFT_wbiAstriaPortaSupportDesc = Combined with the Astria Porta Arbitrium, the Auxilium forms part of a jumpgate that enables users to instantly traverse vast distances to a desired destination gate.
		#LOC_BLUESHIFT_wbiLowGravCompensatorTitle = Low-Grav Compensator
		#LOC_BLUESHIFT_wbiLowGravCompensatorDesc = The Low-Grav Compensator is the result of a contragravity generator experiment that was considered to be a failure until scientists realized that they just needed to reverse the polarity. But the failure gave them an idea: give rovers a downward push on low-g worlds to simulate driving in a 1-g environment.
		#LOC_BLUESHIFT_wbiPlasmaContactorTitle = Plasma Contactor
		#LOC_BLUESHIFT_wbiPlasmaContactorDesc = Gravimetric displacement generators produce StaticCharge when generating GravityWaves. If the vessel accumulates too much StaticCharge, then the generators will shut down. A plasma contactor eliminates the charge by venting ionized xenon gas in vacuum conditions, but if the craft is landed, splashed, or flying in an atmosphere then it can eliminate StaticCharge as well.
		#LOC_BLUESHIFT_wbiPlasmaContactorLargeTitle = Plasma Contactor (Large)
		#LOC_BLUESHIFT_wbiPlasmaContactorLargeDesc = Gravimetric displacement generators produce StaticCharge when generating GravityWaves. If the vessel accumulates too much StaticCharge, then the generators will shut down. A plasma contactor eliminates the charge by venting ionized xenon gas in vacuum conditions, but if the craft is landed, splashed, or flying in an atmosphere then it can eliminate StaticCharge as well.
		#LOC_BLUESHIFT_wbiPlasmaContactorModuleTitle = Plasma Contactor Module
		#LOC_BLUESHIFT_wbiPlasmaContactorModuleDesc = Gravimetric displacement generators produce StaticCharge when generating GravityWaves. If the vessel accumulates too much StaticCharge, then the generators will shut down. This space station module can not only get rid of the static charge, it has a crazy amount of XenonGas.

		// Gravitic Resonator
		#LOC_BLUESHIFT_resonatorTitle = Gravitic Resonator
		#LOC_BLUESHIFT_resonatorDesc = A wearable gravitic field generator that uses polarized graviolium to temporarily reduce, redirect, or counteract the apparent weight of nearby objects. Field strength and recovery time vary considerably with target mass. Warranty does not cover objects subsequently discovered in low orbit.

	}
}
