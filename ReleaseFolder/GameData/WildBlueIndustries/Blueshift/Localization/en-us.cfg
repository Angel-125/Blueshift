		#LOC_BLUESHIFT_wbiS3HeavyWarpSustainerTitle = S-3 Heavy Warp Sustainer
		#LOC_BLUESHIFT_wbiS3HeavyWarpSustainerDesc = The S-3 Heavy Warp Sustainer produces additional Warp Capacity that enables more massive vessels to travel faster than light and/or smaller vessels to go even faster. Instead of relying on parts salvaged from [REDACTED], it uses kerbal-tech to achieve its capabilities.
		#LOC_BLUESHIFT_wbiS3Mk3WarpRingTitle = S3-Mk3 Warp Ring
