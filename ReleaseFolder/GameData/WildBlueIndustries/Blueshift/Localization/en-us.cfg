		// S-2 Flex Grav Generator
		#LOC_BLUESHIFT_flexGravTitle = S-2 Flex Grav Generator
		#LOC_BLUESHIFT_flexGravDesc = The S-2 FlexGrav Generator redirects local gravity into useful acceleration, providing lift, forward thrust, or a blend of both. It can bend up to 95% of the surrounding gravitational force, making it ideal for atmospheric skimming, assisted takeoff, and precision maneuvering near celestial bodies. Performance decreases with altitude as the local gravity field weakens. Rated for 1g service, the S-2 can operate in stronger gravity fields, but pilots should expect reduced effectiveness unless additional generators are installed.

