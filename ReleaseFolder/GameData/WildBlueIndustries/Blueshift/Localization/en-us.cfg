		// Part titles and descriptions
		#LOC_BLUESHIFT_wbiQuantumEntanglementTransceiverTitle = QE-1 Quantum Entanglement Transceiver
		#LOC_BLUESHIFT_wbiQuantumEntanglementTransceiverDesc = Utilizing tightly bound pairs of entangled subatomic particles, the QE-1 delivers instantaneous, zero-latency telemetry data across infinite distances. Because it operates via quantum non-locality, it completely bypasses standard signal blockage and range limitations- so long as there is another QET on the other end.
		#LOC_BLUESHIFT_wbiAlienJumpGateTitle = Jump Gate Anomaly
		#LOC_BLUESHIFT_wbiAlienJumpGateDesc = A large, ring-shaped anomaly that provides instant transport across the expanse.
		#LOC_BLUESHIFT_wbiAstriaPortaControlTitle = Astria Porta Arbitrium
		#LOC_BLUESHIFT_wbiAstriaPortaControlDesc = After studying the [REDACTED] that we [REDACTED], we [REDACTED] the [REDACTED] and then [REDACTED] the [REDACTED] in order to create the Astria Porta Arbitrium. Combined with nine Astria Porta Support Segments, the Arbitrium forms a jumpgate that enables users to instantly traverse vast distances to a desired destination gate.
		#LOC_BLUESHIFT_wbiS1WarpCoilTitle = S-1 Warp Coil
		#LOC_BLUESHIFT_wbiS1WarpCoilDesc = Instead of one large ring shape, this warp coil uses a series of smaller rings to generate the warp capacity needed for faster than light travel. Its output is considerably less than the S-3 Warp Engine’s warp coil, however.
		#LOC_BLUESHIFT_wbiS2WarpCoilTitle = S-2 Warp Coil
		#LOC_BLUESHIFT_wbiS2WarpCoilDesc = Instead of one large ring shape, this warp coil uses a series of smaller rings to generate the warp capacity needed for faster than light travel. Its output is considerably less than the S-3 Warp Engine’s warp coil, however.
		#LOC_BLUESHIFT_wbiMk2FusionReactorTitle = Mk2 Fusion Reactor
		#LOC_BLUESHIFT_wbiMk2FusionReactorDesc = This magneto hydrodynamic fusion reactor consumes fusion pellets to produce electric charge.
		#LOC_BLUESHIFT_wbiS2FusionReactorTitle = S-2 Fusion Reactor
