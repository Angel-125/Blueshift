// Stock exospheric Graviolium harvesting balance
//
// The Kerbin abundance and collector efficiencies reproduce the peak rates
// provided by SpaceDustGravioliumRebalance.cfg when SpaceDust is not installed.

@PLANETARY_RESOURCE:HAS[#ResourceName[Graviolium],#ResourceType[3],#PlanetName[Kerbin]]:NEEDS[!SpaceDust]:AFTER[WildBlueIndustries]
{
	@Distribution
	{
		@MinAbundance = 2.64
		@MaxAbundance = 3.08
	}
}

// Stock ModuleResourceHarvester output is proportional to abundance and
// Efficiency. These values reproduce the SpaceDust collectors' 1:2:4:8
// collection-rate progression from S0 through S2.
@PART[wbiS0BussardCollector]:NEEDS[!SpaceDust]:AFTER[WildBlueIndustries]
{
	@MODULE[ModuleResourceHarvester]:HAS[#ResourceName[Graviolium]]
	{
		@Efficiency = 0.025
	}
}

@PART[wbiS1BussardCollector]:NEEDS[!SpaceDust]:AFTER[WildBlueIndustries]
{
	@MODULE[ModuleResourceHarvester]:HAS[#ResourceName[Graviolium]]
	{
		@Efficiency = 0.05
	}
}

@PART[wbiMk2BussardCollector]:NEEDS[!SpaceDust]:AFTER[WildBlueIndustries]
{
	@MODULE[ModuleResourceHarvester]:HAS[#ResourceName[Graviolium]]
	{
		@Efficiency = 0.1
	}
}

@PART[wbiS2BussardCollector,wbiStardust]:NEEDS[!SpaceDust]:AFTER[WildBlueIndustries]
{
	@MODULE[ModuleResourceHarvester]:HAS[#ResourceName[Graviolium]]
	{
		@Efficiency = 0.2
	}
}
