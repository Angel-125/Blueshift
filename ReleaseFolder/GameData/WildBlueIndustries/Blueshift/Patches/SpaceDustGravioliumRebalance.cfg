// Graviolium harvesting balance
//
// At Kerbin's peak belt density, an aligned S2 Bussard Collector fills a
// 3,600-unit GR-375 tank in approximately 30 Kerbin days. SpaceDust scales
// spherical-band altitudes through its GameScale setting for rescaled systems.

@SPACEDUST_RESOURCE:HAS[#resourceName[Graviolium],#body[Sun]]:NEEDS[SpaceDust]:AFTER[WildBlueIndustries]
{
	@RESOURCEBAND[KerbolGraviolium]
	{
		@minAbundance = 0.00000000000000000018
		@maxAbundance = 0.00000000000000000022
	}
}

