// The three larger Bussard sizes use the same Graviolium conversion efficiency.
// Their 250/500/1000 m2 intake areas therefore provide predictable 4:2:1
// collection times for a fixed tank size.
@PART[wbiS1BussardCollector,wbiMk2BussardCollector,wbiS2BussardCollector]:NEEDS[SpaceDust]:AFTER[WildBlueIndustries]
{
	@MODULE[ModuleSpaceDustHarvester]
	{
		@HARVESTED_RESOURCE[Graviolium]
		{
			@BaseEfficiency = 0.2
			@MinHarvestValue = 0.000000000000000000000000000001
		}
	}
}

// The S0 collector has half the intake area and collection rate of the S1.
@PART[wbiS0BussardCollector]:NEEDS[SpaceDust]:AFTER[WildBlueIndustries]
{
	!MODULE[ModuleResourceHarvester] {}

	MODULE
	{
		name = ModuleSpaceDustHarvester
		ModuleID = harvester

		SystemPower = 18.75
		SystemEfficiency
		{
			key = 0 1.0
			key = 400 1.0
			key = 600 0.0
		}

		PowerCost = 25
		CheckOcclusion = false
		HarvestType = Exosphere
		HarvestIntakeTransformName = Intake
		IntakeArea = 125
		IntakeSpeedStatic = 0
		IntakeVelocityScale
		{
			key = 0 0
			key = 1 1
		}

		HARVESTED_RESOURCE
		{
			Name = Graviolium
			BaseEfficiency = 0.2
			MinHarvestValue = 0.000000000000000000000000000001
		}
	}
}

// Blueshift supplies Stardust when Flying Saucers is absent. With SpaceDust
// installed, use one harvesting model so the UI cannot report a second,
// contradictory stock-resource altitude band.
@PART[wbiStardust]:NEEDS[SpaceDust,!WildBlueIndustries/FlyingSaucers]:AFTER[WildBlueIndustries]
{
	!MODULE[ModuleResourceHarvester]:HAS[#ResourceName[Graviolium]] {}

	MODULE
	{
		name = ModuleSpaceDustHarvester
		ModuleID = gravioliumHarvester

		PowerCost = 60
		CheckOcclusion = false
		HarvestType = Exosphere
		HarvestIntakeTransformName = Intake
		IntakeArea = 100
		IntakeSpeedStatic = 2200
		IntakeVelocityScale
		{
			key = 0 1
		}

		HARVESTED_RESOURCE
		{
			Name = Graviolium
			BaseEfficiency = 1
			MinHarvestValue = 0.000000000000000000000000000001
		}
	}
}

// Flying Saucers also supplies Stardust. Patch its existing SpaceDust module
// from Blueshift so both installation layouts receive the same balance.
@PART[wbiStardust]:NEEDS[SpaceDust,WildBlueIndustries/FlyingSaucers]:AFTER[WildBlueIndustries]
{
	!MODULE[ModuleResourceHarvester]:HAS[#ResourceName[Graviolium]] {}

	@MODULE[ModuleSpaceDustHarvester]
	{
		%PowerCost = 60
		%CheckOcclusion = false
		%IntakeArea = 100
		%IntakeSpeedStatic = 2200

		@HARVESTED_RESOURCE[Graviolium]
		{
			@BaseEfficiency = 1
			@MinHarvestValue = 0.000000000000000000000000000001
		}
	}
}
