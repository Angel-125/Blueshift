// This template is specifically built for the S3WarpEngine.
// There is an identical configuration that's made for the warp rings.
// The difference is that the warp engine's config is tied to the engine throttle,
// while the warp ring's controller is a custom controller.
EFFECTTEMPLATE
{
	templateName = s3WarpEngineRingPlume
	EFFECT
	{
		name = ringPlume
		parentName = genericWarpEngine
		MODEL
		{
			path = Waterfall/FX/fx-cylinder
			positionOffset = 0,0,0
			rotationOffset = 90,0,0
			scaleOffset = 1,1,1
			MATERIAL
			{
				transform = Cylinder
				shader = Waterfall/Additive Directional
				randomizeSeed = True
				TEXTURE
				{
					textureSlotName = _MainTex
					texturePath = Waterfall/FX/fx-noise-3
					textureScale = 1,1
					textureOffset = 0,0
				}
				COLOR
				{
					colorName = _StartTint
					colorValue = 0.349019617,0.533333361,0.886274517,1
				}
				COLOR
				{
					colorName = _EndTint
					colorValue = 0.349019617,0.533333361,0.886274517,1
				}				
				FLOAT
				{
					floatName = _Noise
					value = 2.25
				}
				FLOAT
				{
					floatName = _Brightness
					value = 2.5999999
				}
				FLOAT
				{
					floatName = _SpeedY
					value = 5
				}
				FLOAT
				{
					floatName = _Falloff
					value = 1.29999995
				}
				FLOAT
				{
					floatName = _Fresnel
					value = 1.29999995
				}
				FLOAT
				{
					floatName = _FresnelInvert
					value = 1.54999995
				}
			}
		}
		FLOATMODIFIER
		{
			floatName = _SpeedY
			controllerName = throttle
			transformName = Cylinder
			useRandomness = False
			randomnessController = random
			randomnessScale = 1
			name = plumeSpeed
			combinationType = REPLACE
			floatCurve
			{
				key = 0 0 0 0
				key = 0.1 3 0 0
				key = 0.5 4 0 0
				key = 1 5 0 0
			}
		}
		FLOATMODIFIER
		{
			floatName = _Fresnel
			controllerName = throttle
			transformName = Cylinder
			useRandomness = False
			randomnessController = random
			randomnessScale = 1
			name = plumeFresnel
			combinationType = REPLACE
			floatCurve
			{
				key = 0 0 0 0
				key = 0.1 1.3 0 0
				key = 0.25 1.3 0 0
				key = 0.5 1.3 0 0
				key = 1 1.3 0 0
			}
		}
		FLOATMODIFIER
		{
			floatName = _Brightness
			controllerName = throttle
			transformName = Cylinder
			useRandomness = False
			randomnessController = random
			randomnessScale = 1
			name = plumeAlpha
			combinationType = REPLACE
			floatCurve
			{
				key = 0 0 0 0
				key = 0.1 1.25 0 0
				key = 0.25 1.5 0 0
				key = 0.5 2.5 0 0
				key = 1 2.5 0 0
			}
		}
	}
}